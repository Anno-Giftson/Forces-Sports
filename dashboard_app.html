<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSW Forces Athletics</title>
  <!-- Supabase CDN (so it works directly in the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>CSW Forces Athletics Dashboard</h1>
  <button id="btn-2fa">Send 2FA Code</button>
  <button id="btn-roster">Send Roster Blast</button>

  <script>
    // ==========================================
    // 1. SUPABASE SETUP
    // ==========================================
    // I don't know your keys, so you still have to paste them here!
    const SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    
    // This initializes Supabase safely without breaking the rest of your app
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


    // ==========================================
    // 2. GOOGLE APPS SCRIPT SETUP
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';


    // ==========================================
    // 3. APPS SCRIPT FETCH (CORS-SAFE)
    // ==========================================
    async function sendToAppsScript(payload) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          // CRITICAL: This text/plain header prevents Google from blocking the request
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        console.log("Response from script:", result);
        alert(result.status === "Success" ? "Success!" : "Error: " + result.message);
        
      } catch (error) {
        console.error("Fetch Error:", error);
        alert("Something went wrong. Check the console.");
      }
    }


    // ==========================================
    // 4. BUTTON CLICKS
    // ==========================================
    document.getElementById("btn-2fa").addEventListener("click", () => {
      sendToAppsScript({
        secret: "CSW-2FA-BRIDGE",
        action: "send_2fa",
        name: "Coach", 
        toEmail: "coach@example.com",
        code: Math.floor(100000 + Math.random() * 900000).toString() 
      });
    });

    document.getElementById("btn-roster").addEventListener("click", () => {
      sendToAppsScript({
        secret: "CSW-2FA-BRIDGE",
        action: "roster_blast",
        subject: "Update",
        message: "Test message from the website.",
        senderName: "Athletic Director",
        recipients: ["player1@example.com", "player2@example.com"]
      });
    });
  </script>
</body>
</html>
